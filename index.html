<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小熊的生字森林</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：單欄卡片置中。森林綠＋蜂蜜黃，圓角厚實，低年級看的大字。
   設計原則：只會往前、看得到進度 —— 不限時、不倒數、答錯不扣任何東西，小路上只前進不後退。
   唯一有壓力的是最後的大考驗（三顆愛心），用完了隨時可以再挑戰。 */
:root{
  --bg:#EDF3EA; --surface:#FFFFFF; --surface2:#F6FAF4;
  --ink:#1C3025; --muted:#5E7465; --line:#D4E2D0;
  --accent:#2E7D4F; --accent-soft:#D8EEDF;
  --honey:#E09A2E; --honey-soft:#FBEBCF;
  --berry:#CE524A; --berry-soft:#FADEDB;
  --map1:#DCEFD3; --map2:#C9E4BE; --road:#D9C38C; --road2:#F2E6C4; --stone:#C9B27A;
  --shadow:0 2px 0 rgba(28,48,37,.10), 0 10px 24px -14px rgba(28,48,37,.45);
  --r:18px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --kai:"標楷體","DFKai-SB","BiauKai","Kaiti TC","KaiTi","Noto Serif TC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131B16; --surface:#1C2721; --surface2:#222E27;
  --ink:#E7F0E8; --muted:#95AC9C; --line:#31423A;
  --accent:#5FBF84; --accent-soft:#1E3A2A;
  --honey:#F0B45C; --honey-soft:#3A2E18;
  --berry:#E8776E; --berry-soft:#3D2320;
  --map1:#1C2E22; --map2:#16251B; --road:#5E4E30; --road2:#46402E; --stone:#7A6A45;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131B16; --surface:#1C2721; --surface2:#222E27;
  --ink:#E7F0E8; --muted:#95AC9C; --line:#31423A;
  --accent:#5FBF84; --accent-soft:#1E3A2A;
  --honey:#F0B45C; --honey-soft:#3A2E18;
  --berry:#E8776E; --berry-soft:#3D2320;
  --map1:#1C2E22; --map2:#16251B; --road:#5E4E30; --road2:#46402E; --stone:#7A6A45;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--honey);outline-offset:3px;border-radius:12px}
.hide{display:none!important}
.col{display:flex;flex-direction:column;gap:18px}

/* 注音：直排在國字右邊。聲調貼最後一個符號右側，輕聲的點在最上面。 */
.zb{display:inline-flex;align-items:center;line-height:1;vertical-align:middle}
.zb-c{font-family:var(--kai);font-weight:700;line-height:1;white-space:nowrap}
.zb-r{display:flex;align-items:flex-end;font-size:.42em;line-height:1;margin-left:.22em;font-family:var(--font);font-weight:500}
.zb-r.n3{font-size:.36em}        /* 三個符號會比國字高，縮一點讓注音欄貼齊字高 */
.zb-col{display:flex;flex-direction:column;align-items:center;line-height:.96}
.zb-col i{font-style:normal;display:block}
.zb-col i.zb-l{line-height:.7}
.zb-t{margin-left:.06em;padding-bottom:.04em;white-space:nowrap}
.zb-only .zb-c{display:none}
.zb-only .zb-r{font-size:1em;margin-left:0}

/* 頂部 */
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.back{display:none;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font-size:14px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.back.on{display:inline-flex}
.top .title{font-size:15px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:16px;box-shadow:var(--shadow);flex:none}
.scorepill{background:var(--honey-soft);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.scorepill.pop,.hearts.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.hearts{font-size:17px;letter-spacing:1px;white-space:nowrap}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--honey));border-radius:999px;transition:width .35s cubic-bezier(.3,1.2,.5,1)}

/* 地圖首頁 */
.hero{background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px 20px 18px;text-align:center}
.hero .ver{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:900;padding:5px 12px;border-radius:999px}
.hero h1{font-size:30px;font-weight:900;margin:10px 0 6px}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
/* 地圖：彎彎的小路、站點、風景（座標用 viewBox 單位，--u＝地圖寬度的 1%） */
.mapcard{position:relative;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.28) 0 9%,transparent 10%),radial-gradient(circle at 82% 64%,rgba(255,255,255,.22) 0 8%,transparent 9%),linear-gradient(180deg,var(--map1),var(--map2));border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:10px 8px;overflow:hidden}
.world,.trail{position:relative;width:100%;max-width:440px;margin:0 auto;--u:3.4px}
.world svg,.trail svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.road2{fill:none;stroke:var(--road2);stroke-linecap:round;stroke-linejoin:round}
.roaddash{fill:none;stroke:var(--road);stroke-linecap:round;stroke-dasharray:.1 3.2}
.deco{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*7);line-height:1;pointer-events:none;user-select:none}
.stop{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*17);height:calc(var(--u)*17);padding:0;z-index:2}
.stop .disc{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font-size:calc(var(--u)*8.5);line-height:1;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78%),conic-gradient(var(--accent) var(--p,0%),var(--line) 0);
  box-shadow:0 calc(var(--u)*.9) 0 rgba(0,0,0,.16);transition:transform .12s;position:relative}
.stop.done .disc{background:radial-gradient(closest-side,var(--honey-soft) 76%,transparent 78%),conic-gradient(var(--honey) 100%,var(--honey) 0)}
.stop.done .disc::after{content:"🏅";position:absolute;right:calc(var(--u)*-2);bottom:calc(var(--u)*-1.5);font-size:calc(var(--u)*6.5)}
.stop .lbl{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:12px;padding:5px 10px;box-shadow:var(--shadow);white-space:nowrap;line-height:1.3}
.stop .lbl.r{left:calc(100% + var(--u)*2.5);text-align:left}
.stop .lbl.l{right:calc(100% + var(--u)*2.5);text-align:right}
.stop .lbl b{font-size:15px;font-weight:900;color:var(--ink)}
.stop .lbl i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.stop.stale .disc::before{content:"🌿";position:absolute;left:calc(var(--u)*-2.5);top:calc(var(--u)*-2.5);font-size:calc(var(--u)*7)}
.stop.flag{width:calc(var(--u)*11);height:calc(var(--u)*11);cursor:default}
.stop.flag .disc{background:var(--surface);font-size:calc(var(--u)*6)}
.stop.castle{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.stop.castle .disc{font-size:calc(var(--u)*12);background:radial-gradient(closest-side,var(--honey-soft) 76%,transparent 78%),conic-gradient(var(--honey) 100%,var(--honey) 0)}
.stop.castle .lbl{white-space:normal;width:max-content;max-width:calc(var(--u)*36)}
.stop.castle.mid{width:calc(var(--u)*19);height:calc(var(--u)*19)}
.stop.castle.mid .disc{font-size:calc(var(--u)*10)}
.stop.castle.locked{cursor:default}
.stop.castle.locked .disc{background:var(--surface2);filter:grayscale(1)}
.wbear{position:absolute;transform:translate(-50%,-100%);font-size:calc(var(--u)*9);line-height:1;z-index:3;pointer-events:none;animation:idle 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.deco.friend{font-size:calc(var(--u)*8);animation:idle 2.2s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
@keyframes idle{0%,100%{margin-top:0}50%{margin-top:calc(var(--u)*-1.6)}}

.shelf{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.shelf .fh{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.shelf .fh b{font-size:15px;font-weight:900}
.shelf .fh span{font-size:13px;color:var(--muted);margin-left:auto}
.medals{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end}
.medal{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:58px}
.medal b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface2);border:2px dashed var(--line);filter:grayscale(1);opacity:.45}
.medal i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.medal.on b{filter:none;opacity:1;border:3px solid var(--honey);background:var(--honey-soft)}
.medal.big b{width:72px;height:72px;font-size:40px}
.medal.cup b{width:62px;height:62px;font-size:32px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ware{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ware .wico{font-size:48px;line-height:1.1}
.ware b{font-size:15px;font-weight:900}
.ware.locked .wico{filter:grayscale(.7);opacity:.6}
.ware.using{border-color:var(--honey);background:linear-gradient(180deg,var(--surface),var(--honey-soft))}
.ware .btn{width:100%;padding:9px 6px;font-size:13px}
.scorepill{cursor:pointer}
.prize{margin:12px 0 0;text-align:center;font-size:14px;font-weight:700;line-height:1.7;background:var(--honey-soft);border-radius:12px;padding:10px 12px}

/* 每一課的小路 */
.bhead{display:flex;align-items:center;gap:12px}
.bhead .nico{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--accent-soft)}
.bhead h2{font-size:21px;font-weight:900}
.bhead p{margin:3px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.stone{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*8.6);height:calc(var(--u)*8.6);border-radius:50%;background:var(--surface);border:calc(var(--u)*.6) solid var(--stone);display:grid;place-items:center;font-size:calc(var(--u)*3.3);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.14);transition:background .3s,border-color .3s;z-index:1}
.stone.past{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stone.pot{font-size:calc(var(--u)*4.8)}
.stone.pot.past{filter:grayscale(1);opacity:.55}
.stone.start{width:calc(var(--u)*11);height:calc(var(--u)*11);font-size:calc(var(--u)*5.5)}
.stone.goal{width:calc(var(--u)*15);height:calc(var(--u)*15);font-size:calc(var(--u)*9);border-color:var(--honey);background:var(--honey-soft)}
.token{position:absolute;z-index:3;transform:translate(-50%,-62%);transition-property:left,top;transition-timing-function:cubic-bezier(.4,0,.3,1);pointer-events:none}
.token span{display:grid;place-items:center;width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:var(--surface);border:calc(var(--u)*.7) solid var(--honey);box-shadow:0 4px 10px -3px rgba(0,0,0,.45);font-size:calc(var(--u)*7);line-height:1}
.token.hop span{animation:hop .3s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-34%) scale(1.06)}100%{transform:translateY(0)}}
.bubble{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--ink);color:var(--surface);font-weight:900;font-size:20px;padding:10px 18px;border-radius:999px;z-index:5;pointer-events:none;animation:bubble 1.1s ease-out forwards;white-space:nowrap}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:10px 0 4px;font-size:13px;color:var(--muted);line-height:1.6}

.modes{display:flex;flex-direction:column;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;transition:transform .12s,border-color .12s}
.mode .ico{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:var(--accent-soft)}
.mode:nth-child(2) .ico{background:var(--honey-soft)}
.mode .t{display:block;font-size:18px;font-weight:900;color:var(--ink);margin-bottom:3px}
.mode .d{font-size:13px;color:var(--muted);line-height:1.6;min-width:0;flex:1}
.mode .go{flex:none;font-size:20px;color:var(--muted)}

.listcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.listcard summary{cursor:pointer;font-weight:900;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
.listcard summary::-webkit-details-marker{display:none}
.listcard summary::before{content:"▸";color:var(--accent);transition:transform .2s}
.listcard[open] summary::before{transform:rotate(90deg)}
.lab{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.1em;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;padding:7px 9px;font-size:26px;display:inline-flex;gap:8px}

/* 題目 */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.qtag{display:inline-block;font-size:12px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px}
.qtag.final{color:var(--ink);background:var(--honey-soft)}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:42px;font-weight:700;line-height:1.2;margin:18px 0 2px}
.prompt .blank{color:var(--honey);border-bottom:5px solid var(--honey);padding:0 4px}
.sent{display:flex;flex-wrap:wrap;align-items:center;gap:11px;font-size:31px;line-height:1.25;margin:16px 0 6px}
.sent .punc{align-self:flex-end;padding-bottom:.08em;font-family:var(--kai)}
.sent .blank2{color:var(--honey);border-bottom:4px solid var(--honey);padding:0 3px;font-family:var(--kai)}
.qhint{color:var(--muted);font-size:14px;line-height:1.7;margin:10px 0 0}

.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media (max-width:420px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{aspect-ratio:1;border:3px solid var(--line);background:var(--surface2);border-radius:16px;font-size:40px;font-family:var(--kai);font-weight:700;display:grid;place-items:center;transition:transform .12s,background .15s,border-color .15s}
.opt:disabled{cursor:default}
.opt.right{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{background:var(--berry-soft);border-color:var(--berry);color:var(--berry);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* 拼圈詞：字塊可以拖進格子，也可以點（依序填） */
.slots{display:flex;gap:14px;justify-content:center;margin:20px 0 6px;flex-wrap:wrap}
.slotpair{display:flex;align-items:center;gap:5px}
.slotpair .zb-only{font-size:27px;color:var(--muted)}
.slot{width:76px;height:76px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;font-size:40px;font-family:var(--kai);font-weight:700;background:var(--surface2);transition:border-color .12s,background .12s,transform .12s}
.slot.hot{border-color:var(--honey);background:var(--honey-soft);transform:scale(1.06)}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.slot.bad{border-style:solid;border-color:var(--berry);background:var(--berry-soft);color:var(--berry);animation:shake .4s}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.tile{width:64px;height:64px;border:3px solid var(--line);background:var(--surface2);border-radius:14px;font-size:34px;font-family:var(--kai);font-weight:700;display:grid;place-items:center;transition:transform .12s,opacity .2s;touch-action:none;user-select:none;-webkit-user-select:none}
.tile.lifting{opacity:.3}
.tile.used{opacity:.18;pointer-events:none}
.tile.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-color:var(--honey);background:var(--surface);box-shadow:0 12px 24px -8px rgba(0,0,0,.45);transition:none;margin:0}
.dragtip{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0}

/* 滑鼠真的移動過才顯示 hover，避免題目一換新，剛好在游標／手指下的選項亮起來變成提示 */
@media (hover:hover) and (pointer:fine){
  body.hov .opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}
  body.hov .tile:hover:not(:disabled){transform:translateY(-3px);border-color:var(--honey)}
  body.hov .mode:hover{transform:translateY(-2px);border-color:var(--accent)}
  body.hov button.stop:not(:disabled):hover .disc{transform:scale(1.07)}
  body.hov .btn:hover:not(:disabled){transform:translateY(-2px)}
}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:900;box-shadow:var(--shadow);transition:transform .12s}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--honey);border-color:var(--honey);color:#2a1a00}
.btn.full{flex:1;text-align:center}
.btn:disabled{opacity:.45;cursor:default;transform:none}

/* 回饋 */
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700;line-height:1.7;display:none}
.fb.on{display:block;animation:grow .3s}
.fb.ok{background:var(--accent-soft);color:var(--accent)}
.fb.no{background:var(--honey-soft);color:var(--ink)}
.fb small{display:block;font-weight:500;color:var(--muted);margin-top:5px;font-size:13px;line-height:1.7}
.fbw{display:inline-flex;gap:7px;vertical-align:middle;font-size:27px;margin:0 4px}
.fb small .fbw{font-size:22px}

.done{text-align:center}

  ['🐨','無尾熊',100],['🦉','貓頭鷹',100],['🦌','小鹿',120],['🐯','老虎',150],['🦄','獨角獸',200]];
var CN=['零','一','二','三','四','五','六','七','八','九','十','十一','十二'];

/* ---------- 小工具 ---------- */
function $(s,r){return (r||document).querySelector(s)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function lname(L){return '第'+CN[L.id]+'課'}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function daysSince(s){return s?Math.round((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/864e5):0}
function starStr(n){return '⭐'.repeat(n)+'☆'.repeat(STAR_MAX-n)}
function cpRange(cp){return '第'+CN[cp.lessons[0]]+'～'+CN[cp.lessons[cp.lessons.length-1]]+'課'}
function rangeName(){var a=LESSONS[0].id,b=LESSONS[LESSONS.length-1].id;return a===b?'第'+CN[a]+'課':'第'+CN[a]+'～'+CN[b]+'課'}

/* 直排注音 */
function zbParts(z){
  z=z||'';
  var light=z.charAt(0)==='˙';
  var body=light?z.slice(1):z, tone='';
  var last=body.charAt(body.length-1);
  if(last&&'ˊˇˋ'.indexOf(last)>=0){tone=last;body=body.slice(0,-1)}
  return{light:light,body:body,tone:tone};
}
function zbCol(z){
  var p=zbParts(z);
  return '<span class="zb-r'+(p.body.length>=3?' n3':'')+'"><span class="zb-col">'+
    (p.light?'<i class="zb-l">˙</i>':'')+
    p.body.split('').map(function(s){return '<i>'+esc(s)+'</i>'}).join('')+
    '</span>'+(p.tone?'<span class="zb-t">'+esc(p.tone)+'</span>':'')+'</span>';
}
function zb(chHtml,z){return '<span class="zb"><span class="zb-c">'+chHtml+'</span>'+zbCol(z)+'</span>'}
function zbOnly(z){return '<span class="zb zb-only">'+zbCol(z)+'</span>'}
function zbWord(w,z){
  var zs=String(z).split(/\s+/);
  return w.split('').map(function(c,i){return zb(esc(c),zs[i]||'')}).join('');
}
function itemZb(q){return q.type==='build'?zbWord(q.x.w,q.x.z):zb(esc(q.x.c),q.x.z)}
var PUNC='，。？！、；：「」';
function sentence(x){
  var zs=String(x.sz||'').split(/\s+/),k=0,html='';
  x.s.split('').forEach(function(c){
    if(PUNC.indexOf(c)>=0){html+='<span class="punc">'+esc(c)+'</span>';return}
    var z=zs[k++]||'';
    html+=zb(c==='＿'?'<span class="blank2">？</span>':esc(c),z);
  });
  return el('div','sent',html);
}

/* ---------- 題目索引 ---------- */
var ITEMS={}, BYID={};
LESSONS.forEach(function(L){
  BYID[L.id]=L;
  L.chars.forEach(function(x){var k=L.id+':'+x.c;ITEMS[k]={key:k,L:L,x:x,type:'pick'}});

/* ---------- 存檔 ---------- */
var KEY='xiaoxiong-v1';
var save={honey:0,muted:false,L:{},weak:{},cups:{},friends:[],walker:'🐻'};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){
  save.honey=p.honey|0;save.muted=!!p.muted;
  if(p.L&&typeof p.L==='object')Object.keys(p.L).forEach(function(id){var s=p.L[id];if(!s||typeof s!=='object')return;
    save.L[id]={pos:Math.min(N,Math.max(1,s.pos|0)),pending:Math.max(0,s.pending|0),done:!!s.done,
      ok:(s.ok&&typeof s.ok==='object')?s.ok:{},stars:Math.min(STAR_MAX,Math.max(0,s.stars|0)),last:typeof s.last==='string'?s.last:''}});
  if(p.weak&&typeof p.weak==='object')save.weak=p.weak;
  if(p.cups&&typeof p.cups==='object')save.cups=p.cups;
  if(Array.isArray(p.friends))save.friends=p.friends.filter(function(e){return FRIENDS.some(function(f){return f[0]===e})});
  if(save.friends.indexOf(p.walker)>=0)save.walker=p.walker;
}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function LS(id){var s=save.L[id];if(!s)s=save.L[id]={pos:1,pending:0,done:false,ok:{},stars:0,last:''};return s}
function stale(L){var st=LS(L.id);return st.done&&daysSince(st.last)>=STALE_DAYS}
function cpStars(cp){return cp.lessons.reduce(function(a,id){return a+(BYID[id]?LS(id).stars:0)},0)}
function bonusHearts(cp){return Math.min(3,Math.floor(cpStars(cp)/cp.lessons.length))}
function cpOpen(cp){return cp.lessons.every(function(id){return BYID[id]&&LS(id).done})}

/* ---------- 音效（Web Audio 直接合成，不載檔案） ---------- */
var AC=null;
function ac(){
  if(save.muted)return null;
  try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
       if(AC.state==='suspended')AC.resume();
       return AC; }catch(e){return null}
}
function tone(freq,start,dur,vol,type){
  var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+start;
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxStroke(){tone(880,0,0.07,0.10,'triangle')}
function sfxStep(){tone(660,0,0.08,0.10,'triangle')}
function sfxGood(){tone(784,0,0.11,0.14);tone(1175,0.09,0.17,0.12)}
function sfxDone(){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.08,0.22,0.12)})}
function sfxOops(){tone(300,0,0.13,0.07,'sine')}   /* 低、短、不刺耳 —— 提示而不是責備 */
function sfxHoney(){tone(1047,0,0.09,0.09,'triangle')}
function sfxFanfare(){[[523,0],[659,.14],[784,.28],[1047,.42],[784,.62],[1047,.76]].forEach(function(n){tone(n[0],n[1],n[1]>.6?.5:.2,0.13,'triangle')})}

/* 彩帶 */
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=el('canvas','confetti'),dpr=Math.min(window.devicePixelRatio||1,2);
  document.body.appendChild(cv);
  var W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,c=cv.getContext('2d');
  var cs=getComputedStyle(document.body),cols=['--honey','--accent','--berry'].map(function(v){return cs.getPropertyValue(v).trim()}).concat(['#5B8DEF','#F2C94C','#B57EDC']);
  var ps=[];
  for(var i=0;i<(n||120);i++)ps.push({x:W*(.2+Math.random()*.6),y:H*.42,vx:(Math.random()-.5)*W*.018,vy:-(Math.random()*H*.022+H*.008),
    w:(6+Math.random()*7)*dpr,h:(9+Math.random()*9)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.35,col:cols[i%cols.length]});
  var t0=performance.now();
  (function f(t){
    var age=t-t0;c.clearRect(0,0,W,H);
    ps.forEach(function(p){p.vy+=H*.0006;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      c.save();c.globalAlpha=Math.max(0,1-age/3600);c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
    if(age<3600)requestAnimationFrame(f);else cv.remove();
  })(t0);
}

/* ---------- 地圖 ---------- */
function setU(box){if(box)box.style.setProperty('--u',box.clientWidth/100+'px')}
function pos(x,y,H){return 'left:'+x+'%;top:'+(y/H*100).toFixed(2)+'%'}

/* 森林大地圖：從出發點沿著小路，經過每一課，最上面是大考驗的城堡 */
function worldMap(){
  var stops=[];
  LESSONS.forEach(function(L,i){
    stops.push({L:L,x:i%2?72:28});
    CHECKS.forEach(function(cp){if(cp.after===L.id)stops.push({cp:cp,x:50})});
  });
  var H=24+stops.length*25,start=[50,H-8],pts=[start];
  stops.forEach(function(s,i){s.y=H-8-(i+1)*25;pts.push([s.x,s.y])});
  var d='M'+start[0]+' '+start[1];
  for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]}

  var card=el('div','mapcard'),w=el('div','world');
  w.style.aspectRatio='100 / '+H;
  w.innerHTML='<svg viewBox="0 0 100 '+H+'" aria-hidden="true"><path class="road" d="'+d+'" stroke-width="8"/><path class="road2" d="'+d+'" stroke-width="5.6"/><path class="roaddash" d="'+d+'" stroke-width="1.4"/></svg>';
  /* 風景放在站點的另一側；邀請來的森林朋友先住進去 */
  var deco=['🌲','🌳','🌼','🍄','🪨','🌿','🌷','🌲','🦋','🌳'],spots=[[16,H-12],[84,H-10]];
  stops.forEach(function(s){if(s.L)spots.push([s.x<50?86:13,s.y+4])});
  spots.push([15,12],[86,16]);
  spots.forEach(function(p,i){
    var f=save.friends[i];
    w.appendChild(el('span','deco'+(f?' friend':''),f||deco[i%deco.length])).style.cssText=pos(p[0],p[1],H)+(f?';animation-delay:-'+(i*.37).toFixed(2)+'s':'');
  });
  stops.forEach(function(s,i){if(s.L)w.appendChild(el('span','deco',deco[(i+5)%deco.length])).style.cssText=pos(s.x<50?74:25,s.y+13,H)+';font-size:calc(var(--u)*5)'});

  var flag=el('div','stop flag','<span class="disc">🚩</span><span class="lbl r"><b>出發</b></span>');
  flag.style.cssText=pos(start[0],start[1],H);w.appendChild(flag);

  var here=null;
  stops.forEach(function(s,i){
    var side=s.x<50?'r':'l',b;
    if(s.L){
      var L=s.L,st=LS(L.id),pct=Math.round((st.pos-1)/(N-1)*100);
      var weedy=stale(L);
      b=el('button','stop'+(st.done?' done':'')+(weedy?' stale':''),'<span class="disc" style="--p:'+pct+'%">'+L.icon+'</span>'+
        '<span class="lbl '+side+'"><b>'+lname(L)+'</b><i>'+esc(L.title)+'</i><i>'+(weedy?'🌿 長草了，回來除草 +'+WEED_HONEY+'🍯':st.done?'🏅 '+starStr(st.stars):'🐾 '+(st.pos-1)+' / '+(N-1)+' 步')+'</i></span>');
      b.setAttribute('aria-label',lname(L)+' '+L.title);
      b.addEventListener('click',function(){goBoard(L)});
      if(!here&&!st.done)here=s;
    }else{
      var cp=s.cp,open=cpOpen(cp),won=!!save.cups[cp.id];
      b=el('button','stop castle'+(cp.id==='mid'?' mid':'')+(open?'':' locked'),'<span class="disc">'+(won?'🏆':cp.icon)+'</span>'+
        '<span class="lbl r"><b>'+cp.name+'</b><i>'+(!open?'🔒 '+cpRange(cp)+'都過關才會開門':won?'🏆 '+cp.cup+'到手！':'⭐ 門開了！可以帶 '+(HEARTS+bonusHearts(cp))+' 顆 ❤️ 去挑戰')+'</i>'+
        (open&&!won&&bonusHearts(cp)<3?'<i>複習拿 ⭐ 可以多帶 ❤️</i>':'')+'</span>');
      if(open)b.addEventListener('click',function(){startQuiz('test',null,cp)});else b.disabled=true;
      if(!here&&!won)here=s;
    }
    b.style.cssText+=';'+pos(s.x,s.y,H);
    w.appendChild(b);
  });
  if(here){var hb=el('span','wbear',save.walker);hb.style.cssText=pos(here.x,here.y-(here.cp?10:8.5),H);w.appendChild(hb)}
  card.appendChild(w);
  return card;
}

/* ---------- 每一課的小路 ---------- */
var TRAIL_PTS=null;
function trailPts(){
  if(TRAIL_PTS)return TRAIL_PTS;
  var ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');
  p.setAttribute('d',TRAIL);s.appendChild(p);s.style.cssText='position:absolute;width:0;height:0;visibility:hidden';
  document.body.appendChild(s);
  var len=p.getTotalLength();TRAIL_PTS=[];
  for(var i=0;i<N;i++){var q=p.getPointAtLength(len*i/(N-1));TRAIL_PTS.push([q.x,q.y])}
  s.remove();return TRAIL_PTS;
}
function goBoard(L){
  show('board',lname(L)+'　'+L.title,goMap,'‹ 地圖');
  curL=L;
  var st=LS(L.id),pts=trailPts();
  boardEl.innerHTML='';
  boardEl.appendChild(el('div','bhead','<span class="nico">'+L.icon+'</span><div><h2>'+lname(L)+'〈'+esc(L.title)+'〉</h2><p id="bstat"></p></div>'));

  var card=el('div','mapcard'),t=el('div','trail');
  t.style.aspectRatio='100 / '+TRAIL_H;
  t.innerHTML='<svg viewBox="0 0 100 '+TRAIL_H+'" aria-hidden="true"><path class="road" d="'+TRAIL+'" stroke-width="10"/><path class="road2" d="'+TRAIL+'" stroke-width="7.6"/></svg>';
  var deco=L.deco||['🌲','🌳','🌼','🍄','🪨','🌿','🌷','🌲','🌾','🦋'];
  DECO_POS.forEach(function(p,i){t.appendChild(el('span','deco',deco[i%deco.length])).style.cssText=pos(p[0],p[1],TRAIL_H)});
  pts.forEach(function(p,i){
    var n=i+1,pot=POTS.indexOf(n)>=0;
    var s=el('span','stone'+(n===1?' start':'')+(n===N?' goal':'')+(pot?' pot':''),
      n===1?'🚩':n===N?(st.done?'🏅':'🎁'):pot?'🍯':String(n-1));
    s.dataset.n=n;s.style.cssText=pos(p[0],p[1],TRAIL_H);t.appendChild(s);
  });
  t.appendChild(el('div','token','<span>'+save.walker+'</span>'));
  card.appendChild(t);
  card.appendChild(el('div','legend','<span>🐾 答對一題走一步</span><span>🍯 經過就拿蜂蜜</span><span>🎁 走到終點打開寶箱</span>'));
  boardEl.appendChild(card);

  var modes=el('div','modes');
  [['pick','🔍','第一關　找字','看注音，挑出正確的字'],['build','🧩','第二關　拼圈詞','把字塊拖進格子，拼成圈詞']].forEach(function(m){
    var b=el('button','mode','<span class="ico">'+m[1]+'</span><span class="d"><span class="t">'+m[2]+'</span>'+m[3]+'</span><span class="go">›</span>');
    b.addEventListener('click',function(){startQuiz(m[0],L)});
    modes.appendChild(b);
  });
  boardEl.appendChild(modes);

  var list=el('details','listcard');
  var cs=L.chars.filter(function(x){return !x.read}),rs=L.chars.filter(function(x){return x.read});
  list.innerHTML='<summary>看這一課的生字和圈詞</summary>'+
    '<div class="lab">生字（'+cs.length+' 個習寫字）</div><div class="chips">'+cs.map(function(x){return '<span class="chip">'+zb(esc(x.c),x.z)+'</span>'}).join('')+'</div>'+
    (rs.length?'<div class="lab">認讀字（'+rs.length+' 個）</div><div class="chips">'+rs.map(function(x){return '<span class="chip">'+zb(esc(x.c),x.z)+'</span>'}).join('')+'</div>':'')+
    '<div class="lab">圈詞（'+L.words.length+' 個）</div><div class="chips">'+L.words.map(function(x){return '<span class="chip">'+zbWord(x.w,x.z)+'</span>'}).join('')+'</div>';
  boardEl.appendChild(list);

  boardStatus(L);
  setU(t);markPast(st.pos);placeToken(st.pos,null);
  if(st.pending>0&&!st.done)setTimeout(function(){walk(L)},500);
}
function boardStatus(L){
  var st=LS(L.id),p=$('#bstat');if(!p)return;
  p.textContent=st.done?(stale(L)?'🌿 小路長草了！玩一輪就能除草，送 '+WEED_HONEY+' 🍯。':'')+
      (st.stars>=STAR_MAX?'🏅 過關了，複習星星 '+starStr(st.stars)+' 收集滿了！':'🏅 過關了！複習一輪一題都沒錯就拿 ⭐（'+starStr(st.stars)+'），⭐ 越多，考驗時愛心越多。'):
    st.pending>0?'小熊有 '+st.pending+' 步要走…':
    st.pos>1?'小熊走了 '+(st.pos-1)+' 步，再 '+(N-st.pos)+' 步就到寶箱 🎁':'答對一題，小熊就往前走一步，走 '+(N-1)+' 步到寶箱 🎁';
}
function markPast(p){boardEl.querySelectorAll('.stone').forEach(function(s){var n=+s.dataset.n;s.classList.toggle('past',n<p&&n>1)})}
function placeToken(n,how){
  var tk=$('.token',boardEl),p=trailPts()[n-1];if(!tk||!p)return;
  tk.style.transitionDuration=how?'.3s':'0s';
  tk.style.left=p[0]+'%';tk.style.top=(p[1]/TRAIL_H*100)+'%';
  if(how==='hop'){tk.classList.remove('hop');void tk.offsetWidth;tk.classList.add('hop')}
}
function bubble(txt){var w=$('.mapcard',boardEl);if(!w)return;var b=el('div','bubble',txt);w.appendChild(b);setTimeout(function(){b.remove()},1150)}

/* 小熊一步一步走：經過蜂蜜罐就拿走，走到終點打開寶箱 */
function walk(L){
  var id=++walkId,st=LS(L.id);
  function step(){
    if(id!==walkId)return;
    if(st.done||st.pending<=0){st.pending=0;persist();boardStatus(L);return}
    st.pending--;st.pos=Math.min(N,st.pos+1);persist();
    placeToken(st.pos,'hop');sfxStep();markPast(st.pos);boardStatus(L);
    setTimeout(function(){
      if(id!==walkId)return;
      if(st.pos>=N){st.pending=0;st.done=true;st.last=today();persist();boardStatus(L);return lessonClear(L)}
      if(POTS.indexOf(st.pos)>=0){bubble('🍯 +'+POT_HONEY);addHoney(POT_HONEY);setTimeout(step,650)}
      else setTimeout(step,240);
    },340);
  }
  step();
}

/* ---------- 出題 ---------- */
function lessonSet(L,type){
  var st=LS(L.id);
  var items=(type==='pick'?L.chars.map(function(x){return ITEMS[L.id+':'+x.c]}):L.words.map(function(x){return ITEMS[L.id+':'+x.w]}));
  /* 還沒答對過的先出，所有題目輪流出現 */
  return shuffle(items).sort(function(a,b){return (st.ok[a.key]|0)-(st.ok[b.key]|0)}).slice(0,PER_ROUND);
}
function testSet(cp){
  function take(type,n){
    var all=Object.keys(ITEMS).map(function(k){return ITEMS[k]}).filter(function(q){return q.type===type&&cp.lessons.indexOf(q.L.id)>=0});
    var weak=shuffle(all.filter(function(q){return save.weak[q.key]})).slice(0,Math.ceil(n/2));  /* 不熟的最多占一半 */
    var rest=shuffle(all.filter(function(q){return weak.indexOf(q)<0})).slice(0,n-weak.length);
    return weak.concat(rest);
  }
  return shuffle(take('pick',cp.pick).concat(take('build',cp.build)));
}

function startQuiz(mode,L,cp){
  G={mode:mode,L:L||null,cp:cp||null,qs:[],i:0,gain:0,steps:0,retry:[],round:0,missed:{},hearts:HEARTS,right:0,firstMiss:0};
  if(mode==='test'){G.hearts=G.maxHearts=HEARTS+bonusHearts(cp);G.intro=true}
  else{G.review=LS(L.id).done;G.weedy=stale(L)}
  var title=mode==='test'?cp.icon+' '+cp.name:(mode==='pick'?'第一關　找字':'第二關　拼圈詞');
  show('stage',title,mode==='test'?goMap:function(){goBoard(L)},mode==='test'?'‹ 地圖':'‹ 小路');
  G.mode=mode;
  G.qs=mode==='test'?testSet(cp):lessonSet(L,mode);
  if(mode==='test'){heartsEl.classList.remove('hide');renderHearts(false)}
  setBar();render();
}
function setBar(){bar.style.width=(G.qs.length?Math.round(G.i/G.qs.length*100):0)+'%'}
function renderHearts(popIt){
  heartsEl.textContent='❤️'.repeat(Math.max(0,G.hearts))+'🤍'.repeat(G.maxHearts-Math.max(0,G.hearts));
  if(popIt){heartsEl.classList.remove('pop');void heartsEl.offsetWidth;heartsEl.classList.add('pop')}
}

function render(){
  calm();window.scrollTo(0,0);
  if(G.mode==='test'){
    if(G.intro)return testIntro();
    if(G.hearts<=0)return testFail();
    if(G.i>=G.qs.length)return testWin();
  }else if(G.i>=G.qs.length){
    if(G.retry.length&&G.round<MAXROUND)return roundBreak();
    return finish();
  }
  var q=G.qs[G.i];
  if(q.type==='pick')renderPick(q);else renderBuild(q);
}

function roundBreak(){
  var items=shuffle(G.retry);
  G.retry=[];G.round++;G.qs=items;G.i=0;setBar();
  topTitle.textContent=(G.mode==='pick'?'第一關　找字':'第二關　拼圈詞')+'　🔁 再練一次';
  stage.innerHTML='';
  var card=el('div','card done');
  card.appendChild(el('div','big','🔁'));
  card.appendChild(el('h2',null,'再來一次！'));
  card.appendChild(el('p',null,'剛剛還不太熟的有 '+items.length+' 個，答對了一樣可以往前走。'));
  card.appendChild(el('p',null,'小熊陪你再來一遍，答錯不會扣蜂蜜。'));
  var r=el('div','redo'),go=el('button','btn main','開始 →');
  go.addEventListener('click',function(){render()});
  r.appendChild(go);card.appendChild(r);
  stage.appendChild(card);focusIf(go);
}

function qtag(q){
  var n='第 '+(G.i+1)+' / '+G.qs.length+' 題';
  if(G.mode==='test')return el('span','qtag final',G.cp.icon+' '+G.cp.name+'　'+lname(q.L)+'　'+n);
  return el('span','qtag',(G.round?'🔁 複習　':'')+(q.type==='build'?'圈詞':q.x.read?'認讀字':'生字')+'　'+n);
}
function stepChip(q){return G.mode!=='test'&&!LS(q.L.id).done?'<span class="stepchip">🐾 +1 步</span>':''}

/* 記錄結果。right：這一題一次就做對 */
function answered(q,right){
  if(G.mode==='test'){
    if(right){G.right++;addHoney(2)}
    else{G.hearts--;G.missed[q.key]=1;save.weak[q.key]=1;persist();renderHearts(true)}
    return;
  }
  var st=LS(q.L.id);
  if(right){
    st.ok[q.key]=(st.ok[q.key]|0)+1;
    if(!G.round)delete save.weak[q.key];
    if(!st.done){st.pending++;G.steps++}
  }else{
    if(!G.round)G.firstMiss++;
    G.missed[q.key]=1;save.weak[q.key]=1;
    if(G.retry.indexOf(q)<0)G.retry.push(q);
  }
  persist();
}

/* 找字的題目本體 */
function pickUI(card,x,done){
  var zs=x.wz.split(/\s+/);
  card.appendChild(el('div','prompt',x.w.split('').map(function(c,i){
    return zb(c==='＿'?'<span class="blank">？</span>':esc(c),zs[i]||'');
  }).join('')));
  card.appendChild(el('p','qhint','提示：'+esc(x.t)));
  var opts=el('div','opts');
  shuffle([x.c].concat(x.o)).forEach(function(ch){
    var b=el('button','opt',esc(ch));
    b.addEventListener('click',function(){
      opts.querySelectorAll('.opt').forEach(function(o){o.disabled=true});
      var right=ch===x.c;
      b.className='opt '+(right?'right':'wrong');
      if(!right)opts.querySelectorAll('.opt').forEach(function(o){if(o.textContent===x.c)o.className='opt right'});
      done(right,ch);
    });
    opts.appendChild(b);
  });
  card.appendChild(opts);
}

/* ---------- 第一關：找字 ---------- */
function renderPick(q){
  var x=q.x;
  stage.innerHTML='';
  var card=el('div','card');
  card.appendChild(qtag(q));
  pickUI(card,x,function(right,ch){
    var word='<span class="fbw">'+zbWord(x.w.replace('＿',x.c),x.wz)+'</span>';
    answered(q,right);
    if(right){
      sfxGood();
      if(G.mode!=='test')addHoney(G.round?1:2);
      ok(card,(G.round?'這次對了！':'答對了！')+word+stepChip(q));
    }else{
      sfxOops();
      no(card,'是這個字喔 <span class="fbw">'+zb(esc(x.c),x.z)+'</span>',
        '「'+esc(ch)+'」和「'+esc(x.c)+'」長得很像，很容易看錯。正確是 '+word+
        (G.mode==='test'?'　少了一顆 ❤️，還有 '+Math.max(0,G.hearts)+' 顆。':'　待會兒再練一次就記得了。'));
    }
    next(card);
  });
  stage.appendChild(card);
}

/* ---------- 第二關：拼圈詞（拖拉或點選） ---------- */
function buildDistractors(x){
  var target=x.w.split(''),pool=[];
  /* 先從這幾個字的「長得像」清單挑，再從同一課補 */
  target.forEach(function(ch){
    LESSONS.forEach(function(L){L.chars.forEach(function(c){if(c.c===ch)pool=pool.concat(c.o)})});
  });
  pool=shuffle(pool).filter(function(c,i,a){return target.indexOf(c)<0&&a.indexOf(c)===i});
  var picked=pool.slice(0,2);
  var L=null;Object.keys(ITEMS).forEach(function(k){if(ITEMS[k].x===x)L=ITEMS[k].L});
  shuffle((L||LESSONS[0]).chars).forEach(function(c){
    if(picked.length<3&&target.indexOf(c.c)<0&&picked.indexOf(c.c)<0)picked.push(c.c);
  });
  return picked;
}
function renderBuild(q){
  var x=q.x,target=x.w.split(''),placed=[],err=false,over=false;
  stage.innerHTML='';
  var card=el('div','card');
  card.appendChild(qtag(q));
  card.appendChild(sentence(x));

  var zs=x.z.split(/\s+/);
  var slots=el('div','slots');
  slots.innerHTML=target.map(function(ch,i){
    return '<div class="slotpair"><div class="slot" data-i="'+i+'"></div>'+zbOnly(zs[i]||'')+'</div>';
  }).join('');
  card.appendChild(slots);
  var slotEls=[].slice.call(slots.querySelectorAll('.slot'));

  var tray=el('div','tray');
  shuffle(target.concat(buildDistractors(x))).forEach(function(ch){
    var t=el('button','tile',esc(ch));
    dragTile(t,ch,slotEls,function(i){return tryPlace(t,ch,i)});
    tray.appendChild(t);
  });
  card.appendChild(tray);
  card.appendChild(el('p','dragtip','把字塊拖到格子裡，也可以照順序點'));
  stage.appendChild(card);

  /* i 是放進第幾格；null 代表用點的，放進下一個空格 */
  function tryPlace(tile,ch,i){
    if(over)return false;
    if(i==null){for(var k=0;k<target.length;k++)if(!placed[k]){i=k;break}}
    if(i==null||placed[i])return false;
    var s=slotEls[i];
    if(target[i]===ch){
      placed[i]=ch;s.textContent=ch;s.className='slot filled';tile.className='tile used';tile.disabled=true;sfxStroke();
      if(placed.filter(Boolean).length===target.length)complete();
      return true;
    }
    /* 放錯：格子抖一下，字塊回到原位。不會把錯字留在格子裡 */
    s.textContent=ch;s.className='slot bad';sfxOops();
    setTimeout(function(){if(!placed[i]){s.className='slot';s.textContent=''}},500);
    if(!err){err=true;if(G.mode==='test')answered(q,false)}
    return false;
  }
  function complete(){
    over=true;
    tray.querySelectorAll('.tile').forEach(function(t){t.disabled=true});
    $('.dragtip',card).remove();
    var wh='<span class="fbw">'+zbWord(x.w,x.z)+'</span>';
    if(G.mode==='test'){
      if(!err){answered(q,true);sfxGood();ok(card,'拼好了！'+wh)}
      else{sfxGood();no(card,'拼好了 '+wh,'剛剛放錯一次，少了一顆 ❤️，還有 '+Math.max(0,G.hearts)+' 顆。')}
    }else{
      answered(q,!err);sfxGood();addHoney(err||G.round?1:3);
      if(err)ok(card,'拼好了！'+wh+'　待會兒再拼一次就更熟了。');
      else ok(card,'拼好了！'+wh+stepChip(q));
    }
    next(card);
  }
}
/* 用 Pointer Events 做拖拉：手指、觸控筆、滑鼠都可以 */
function dragTile(t,ch,slotEls,place){
  t.addEventListener('click',function(e){if(e.detail===0)place(null)});   /* 鍵盤 Enter／空白鍵 */
  t.addEventListener('pointerdown',function(e){
    if(t.disabled||e.button>0)return;
    e.preventDefault();
    var r=t.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,moved=false,ghost=null,hot=null;
    try{t.setPointerCapture(e.pointerId)}catch(_){}
    function slotAt(px,py){
      for(var i=0;i<slotEls.length;i++){var s=slotEls[i];if(s.classList.contains('filled'))continue;
        var b=s.getBoundingClientRect();if(px>b.left-14&&px<b.right+14&&py>b.top-14&&py<b.bottom+14)return s}
      return null;
    }
    function mv(ev){
      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<8)return;
      if(!moved){
        moved=true;ghost=t.cloneNode(true);ghost.className='tile ghost';
        ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
        document.body.appendChild(ghost);t.classList.add('lifting');
      }
      ghost.style.transform='translate('+(r.left+dx)+'px,'+(r.top+dy)+'px) scale(1.1)';
      var s=slotAt(ev.clientX,ev.clientY);
      if(s!==hot){if(hot)hot.classList.remove('hot');hot=s;if(hot)hot.classList.add('hot')}
    }
    function end(ev){
      t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',end);t.removeEventListener('pointercancel',end);
      if(hot)hot.classList.remove('hot');
      if(!moved){if(ev.type==='pointerup')place(null);return}
      var okDrop=ev.type==='pointerup'&&hot&&place(+hot.dataset.i);
      t.classList.remove('lifting');
      if(okDrop){ghost.remove();return}
      ghost.style.transition='transform .2s ease-out';
      ghost.style.transform='translate('+r.left+'px,'+r.top+'px) scale(1)';
      setTimeout(function(){ghost.remove()},220);
    }
    t.addEventListener('pointermove',mv);t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  });
}

/* ---------- 回饋 / 下一題 ---------- */
function ok(card,msg){card.appendChild(el('div','fb ok on','🎉 '+msg))}
function no(card,msg,sub){card.appendChild(el('div','fb no on','💡 '+msg+(sub?'<small>'+sub+'</small>':'')))}
function next(card){
  var last=G.i===G.qs.length-1,label='下一題 →';
  if(G.mode==='test'){if(last||G.hearts<=0)label='看結果 →'}
  else if(last)label=G.retry.length&&G.round<MAXROUND?'再練一次 →':'看成果 →';
  var t=el('div','tools'),b=el('button','btn main full',label);
  b.addEventListener('click',function(){G.i++;setBar();render()});
  t.appendChild(b);card.appendChild(t);focusIf(b);
}
function missBox(note){
  var miss=Object.keys(G.missed);if(!miss.length)return null;
  var mb=el('div','misscard');
  mb.innerHTML='<div class="misslab">這幾個可以再多看一下</div><div class="missrow">'+
    miss.map(function(k){return '<span>'+itemZb(ITEMS[k])+'</span>'}).join('')+'</div>'+
    (note?'<p class="missnote">'+note+'</p>':'');
  return mb;
}

/* ---------- 結算：只講收穫，不算錯幾題 ---------- */
function finish(){
  bar.style.width='100%';
  var L=G.L,st=LS(L.id),loot=[],star=false;
  if(G.review){
    if(G.weedy){addHoney(WEED_HONEY);loot.push('🌿 除草完成 +'+WEED_HONEY+' 🍯')}
    if(!G.firstMiss&&st.stars<STAR_MAX){st.stars++;star=true;loot.push('⭐ 複習星星 '+starStr(st.stars))}
  }
  st.last=today();persist();
  stage.innerHTML='';
  var card=el('div','card done');
  card.appendChild(el('div','big',star?'⭐':G.steps&&!st.done?'🐾':'🐻'));
  card.appendChild(el('h2',null,star?'一題都沒錯，拿到複習星星！':G.steps&&!st.done?'小熊可以往前走 '+G.steps+' 步！':'這一輪完成了！'));
  card.appendChild(el('div','gain','+'+G.gain+' 🍯'));
  if(loot.length)card.appendChild(el('div','loot',loot.map(function(x){return '<span>'+x+'</span>'}).join('')));
  card.appendChild(el('p',null,!st.done?(G.steps?'回到小路上，看小熊一步一步往寶箱前進！':'再玩一輪，答對就能往前走。'):
    st.stars>=STAR_MAX?'這一課的複習星星收集滿了，蜂蜜照樣收下！':
    '一輪一題都沒錯就能拿 ⭐（現在 '+starStr(st.stars)+'），<br>⭐ 越多，考驗的時候可以多帶愛心！'));
  var mb=missBox('已經在剛剛的複習輪練過了，寫作業時再留意一下就好。');if(mb)card.appendChild(mb);
  var r=el('div','redo');
  var walkB=el('button','btn main',st.pending>0&&!st.done?'看小熊前進 →':'回小路');
  walkB.addEventListener('click',function(){goBoard(L)});
  var again=el('button','btn','再玩一輪');
  again.addEventListener('click',function(){startQuiz(G.mode,L)});
  r.appendChild(walkB);r.appendChild(again);card.appendChild(r);
  stage.appendChild(card);
  sfxDone();focusIf(walkB);
}

function testWin(){
  bar.style.width='100%';
  var cp=G.cp,first=!save.cups[cp.id];
  save.cups[cp.id]={hearts:G.hearts,date:today()};
  persist();addHoney(cp.honey);
  stage.innerHTML='';
  var card=el('div','card done');
  card.appendChild(el('div',null,'<span class="trophy'+(cp.id==='mid'?' small':'')+'">🏆</span>'));
  card.appendChild(el('h2',null,cp.name+'通過！'));
  card.appendChild(el('p',null,(first?'你贏得了':'你又一次贏得')+'「'+cp.cup+'」！<br>'+cpRange(cp)+'的生字都難不倒你了。'+
    (cp.id==='mid'&&!save.cups.final?'<br>繼續往第十課出發，最後的大考驗有大獎盃等著你！':'')));
  card.appendChild(el('div','loot','<span>🏆 '+cp.cup+'</span><span>'+'❤️'.repeat(G.hearts)+' 剩 '+G.hearts+' 顆愛心</span><span>+'+cp.honey+' 🍯</span>'));
  if(cp.prize)card.appendChild(el('p','prize','🎁 '+esc(cp.prize)));
  var mb=missBox();if(mb)card.appendChild(mb);
  var r=el('div','redo'),b=el('button','btn gold','回地圖看獎盃');
  b.addEventListener('click',goMap);r.appendChild(b);card.appendChild(r);
  stage.appendChild(card);
  sfxFanfare();confetti(cp.id==='mid'?150:200);if(cp.id!=='mid')setTimeout(function(){confetti(120)},900);focusIf(b);
}
function testFail(){
  var cp=G.cp;
  stage.innerHTML='';
  var card=el('div','card done');
  card.appendChild(el('div','big','💪'));
  card.appendChild(el('h2',null,'差一點點！'));
  card.appendChild(el('p',null,'愛心用完了'+(G.right?'，不過你已經答對 '+G.right+' 題':'')+'。<br>回各課的小路再練一練，準備好隨時可以再來挑戰！'));
  var mb=missBox('這幾個先多練習，下次就會了。');if(mb)card.appendChild(mb);
  var r=el('div','redo'),again=el('button','btn main','再挑戰一次'),back=el('button','btn','回地圖');
  again.addEventListener('click',function(){startQuiz('test',null,cp)});back.addEventListener('click',goMap);
  r.appendChild(again);r.appendChild(back);card.appendChild(r);
  stage.appendChild(card);focusIf(again);
}

/* ---------- 蜂蜜商店 ---------- */
var buyArm=null;
function goShop(){
  show('shop','🍯 蜂蜜商店',goMap,'‹ 地圖');
  shopEl.innerHTML='';
  shopEl.appendChild(el('div','hero','<h1>🍯 蜂蜜商店</h1><p>用蜂蜜邀請森林朋友！朋友會搬進你的森林地圖，<br>也可以換牠陪你走小路。</p><div class="gain">🍯 '+save.honey+'</div>'));
  var grid=el('div','shopgrid');
  [['🐻','小熊',0]].concat(FRIENDS).forEach(function(f){
    var e=f[0],own=e==='🐻'||save.friends.indexOf(e)>=0,using=save.walker===e,short=f[2]-save.honey;
    var c=el('div','ware'+(own?'':' locked')+(using?' using':''),'<span class="wico">'+e+'</span><b>'+f[1]+'</b>');
    var b=el('button','btn'+(own&&!using?' main':''));
    if(using){b.textContent='陪你冒險中 ✓';b.disabled=true}
    else if(own){b.textContent='換牠走小路';b.addEventListener('click',function(){save.walker=e;persist();sfxGood();goShop()})}
    else if(short>0){b.textContent='還差 '+short+' 🍯';b.disabled=true}
    else{
      b.textContent='🍯 '+f[2]+' 邀請';
      b.addEventListener('click',function(){
        if(buyArm!==b){            /* 按兩次才買，避免小朋友誤按 */
          if(buyArm)buyArm.reset();buyArm=b;b.className='btn gold';b.textContent='確定用 '+f[2]+' 🍯？';
          b.reset=function(){b.className='btn';b.textContent='🍯 '+f[2]+' 邀請'};
          setTimeout(function(){if(buyArm===b){b.reset();buyArm=null}},4000);
          return;
        }
        buyArm=null;save.honey-=f[2];save.friends.push(e);persist();renderScore(true);sfxFanfare();confetti(70);
        goShop();
        var card=openModal();
        card.appendChild(el('div','done','<div class="big"><span class="chest">'+e+'</span></div><h2>'+f[1]+'搬進森林了！</h2><p>回地圖就能看到牠。要不要換牠陪你走小路？</p>'));
        var r=el('div','redo'),yes=el('button','btn gold','好，換牠！'),no=el('button','btn','先不要');
        yes.addEventListener('click',function(){save.walker=e;persist();closeModal();goShop()});
        no.addEventListener('click',closeModal);
        r.appendChild(yes);r.appendChild(no);card.appendChild(r);focusIf(yes);
      });
    }
    c.appendChild(b);grid.appendChild(c);
  });
  shopEl.appendChild(grid);
  shopEl.appendChild(el('p','foot','答對題目、經過路上的 🍯、打開寶箱、通過考驗都能拿到蜂蜜。'));
  renderScore(false);
}

syncSound();renderScore(false);goMap();
</script>
